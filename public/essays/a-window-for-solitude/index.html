    <h1 class="article-title">给孤独留一扇窗</h1>
    <div class="article-en">a window for solitude</div>
    
    <div class="article-rule"></div>

    <div class="article-body">
      <p>孤独不是关上门，而是在深夜给自己留一扇窗，让风偶尔进来，让路灯的光在地板上洇开一小片。</p>
<p>我从不与人解释我的安静。窗开着的时候，世界是经过的，不是闯入的。</p>
